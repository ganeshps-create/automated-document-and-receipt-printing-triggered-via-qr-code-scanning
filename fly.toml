app = 'qr-se-print'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  DATA_DIR = '/app/data'
  PAYMENT_PROVIDER = 'demo'
  PUBLIC_URL = 'https://qr-se-print.fly.dev'

[[services]]
  internal_port = 3000
  protocol = 'tcp'

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[mounts]]
  source = 'qsp_data'
  destination = '/app/data'
